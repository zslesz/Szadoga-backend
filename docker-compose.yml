version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: uld_postgres_db
    restart: always
    environment:
      POSTGRES_USER: uld_user
      POSTGRES_PASSWORD: uld_password
      POSTGRES_DB: uld_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
version: '3.8'

services:
  # 1. Az Adatbázis konténer
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: uld_user
      POSTGRES_PASSWORD: uld_password
      POSTGRES_DB: uld_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. A FastAPI Backend konténer
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://uld_user:uld_password@db:5432/uld_db
    depends_on:
      - db
    volumes:
      # Ez a trükk szinkronizálja a te mappádat a konténerrel.
      # Ha módosítod a Python kódot, azonnal frissül a konténerben is!
      - .:/app

volumes:
  postgres_data: